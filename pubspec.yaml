name: dictation
description: >-
  Hold a hotkey, speak, and the words are typed into whatever window has focus.
  Local speech recognition on Windows, in pure Dart.
version: 0.1.0
publish_to: none
repository: https://github.com/lohanidamodar/dictation

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  ffi: ^2.1.0
  sherpa_onnx: 1.13.4
  voice_models:
    git:
      url: https://github.com/lohanidamodar/voice-models.git
  win32: ^6.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
