name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.version }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' -replace '^v', '' }

          # The filenames, the installer and the About box all come from
          # pubspec.yaml. A tag that disagrees with it ships a build labelled
          # with the wrong version, so stop rather than guess which is right.
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($tag -ne $pubspec) {
            throw "Tag says $tag but pubspec.yaml says $pubspec. Update one of them."
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      # `flutter pub`, not `dart pub`: sherpa-onnx publishes its Dart FFI
      # bindings as a Flutter plugin. Nothing Flutter reaches the binary.
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart test

      - name: Build the portable package
        run: |
          dart run tool/make_icon.dart
          dart run tool/package.dart

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\dictation.iss /DVersion=${{ steps.version.outputs.version }}

      - name: Checksums
        shell: pwsh
        working-directory: build
        run: |
          Get-ChildItem -Filter 'dictation-*' -File |
            Where-Object { $_.Extension -in '.zip', '.exe' } |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = @"
## Install

**[dictation-$v-windows-x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/v$v/dictation-$v-windows-x64-setup.exe)** — installs for the current user, so it needs no administrator. Or take the ``.zip`` and run ``dictate.exe`` from anywhere.

Hold **Ctrl+Alt+D**, speak, let go.

## First run

It downloads a speech model, about 640 MB, and **shows you the licence before it does**. That download is shared with any other PopupBits app on this machine. Afterwards nothing leaves your computer — recognition is local and works offline.

## Licences

The program is MIT. The models are not, and one of them is not open source at all. See ``THIRD-PARTY-NOTICES.md`` in the download.

Windows x64 only. Verify with ``SHA256SUMS.txt``.
"@
          gh release create "v$v" `
            build/dictation-$v-windows-x64-setup.exe `
            build/dictation-$v-windows-x64.zip `
            build/SHA256SUMS.txt `
            --title "dictation $v" --notes $notes
