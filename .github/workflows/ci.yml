name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows, because that is the only platform this builds for — the code
    # calls waveIn and SendInput directly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `flutter pub`, not `dart pub`: sherpa-onnx publishes its Dart FFI
      # bindings as a Flutter plugin, so resolving them needs the Flutter SDK.
      # Nothing Flutter reaches the binary — `dart compile exe` produces a
      # plain Win32 program.
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart test

      # The release build has to keep working, not just the library. Packaging
      # is where a missing notices file or a moved sherpa release shows up.
      - run: dart run tool/make_icon.dart
      - run: dart run tool/package.dart
